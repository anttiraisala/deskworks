  let v;
  try { v = JSON.parse(text); } catch (e) { return { error: `Not valid JSON: ${e.message}` }; }
  if (!isObj(v)) return { error: "The JSON must be an object (a file, a layout, or a split/pane tree)." };
  if (has(v, "layouts")) {
    if (!Array.isArray(v.layouts) || !v.layouts.length || !v.layouts.every(isObj)) return { error: "'layouts' must be a non-empty list of layout objects." };
    return { kind: "file", doc: v, layouts: v.layouts };
  }
  if (has(v, "split")) {
    if (!isObj(v.split)) return { error: "'split' must be an object." };
    return { kind: "layout", doc: v, layouts: [v] };
  }
  return { kind: "tree", doc: { split: v }, layouts: [{ split: v }] };
}

function layoutOnly(l) {
  const out = {};
  for (const [k, v] of Object.entries(l)) if (!FILE_KEYS.has(k)) out[k] = v;
  return out;
}

function importReplaceLayout(p) {
  change(() => {
    const incoming = layoutOnly(p.layouts[0]);
    if (multi()) {
      const old = S.doc.layouts[S.layoutIndex];
      if (!has(incoming, "name") && has(old, "name")) incoming.name = old.name;
      S.doc.layouts[S.layoutIndex] = incoming;
    } else {
      for (const k of Object.keys(S.doc)) if (!FILE_KEYS.has(k)) delete S.doc[k];
      Object.assign(S.doc, incoming);
    }
    S.sel = { kind: "layout" };
  });
}

function importAddLayouts(p) {
  change(() => {
    ensureMulti();
    const first = S.doc.layouts.length;
    for (const l of p.layouts) {
      const copy = layoutOnly(JSON.parse(JSON.stringify(l)));
      copy.name = uniqueName(has(copy, "name") ? String(copy.name) : "imported");
      S.doc.layouts.push(copy);
    }
    S.layoutIndex = first;
    S.sel = { kind: "layout" };
  });
}

function importReplaceFile(p) {
  change(() => {
    S.doc = JSON.parse(JSON.stringify(p.doc));
    S.layoutIndex = 0;
    S.sel = { kind: "layout" };
  });
}

function openJson() {
  flushFields();
  let dlg = $("#json-dialog");
  if (dlg) dlg.remove();
  dlg = h("dialog", { id: "json-dialog", class: "tp-dialog wide" });
  let whole = false;
  const box = h("textarea", { id: "json-text", spellcheck: "false", rows: "18" });
  const msg = h("div", { id: "json-message", class: "cmd-note" });
  const copyBtn = h("button", { id: "json-copy", title: "Copy the text to the clipboard" }, "Copy");
  const bReplaceLayout = h("button", { id: "json-replace-layout" }, "Replace this layout");
  const bAdd = h("button", { id: "json-add" }, "Add as new layout");
  const bReplaceFile = h("button", { id: "json-replace-file" }, "Replace whole file");
  const fill = () => { box.value = jsonText(whole); msg.textContent = ""; };
  const run = (fn) => () => {
    const p = parseImport(box.value);
    if (p.error) { msg.textContent = p.error; msg.classList.add("bad"); return; }
    fn(p);
    dlg.close();
  };
  copyBtn.addEventListener("click", () => copyText(box.value, copyBtn));
  bReplaceLayout.addEventListener("click", run(importReplaceLayout));
  bAdd.addEventListener("click", run(importAddLayouts));
  bReplaceFile.addEventListener("click", run(importReplaceFile));
  const scope = multi() ? h("div", { class: "unit-row" },
    h("span", { style: { color: "var(--muted)", fontSize: "12px", alignSelf: "center" } }, "Show"),
    h("span", { class: "seg" },
      h("button", { id: "json-scope-layout", class: "on", onclick: (e) => { whole = false; fill(); markScope(e.target); } }, "this layout"),
      h("button", { id: "json-scope-file", onclick: (e) => { whole = true; fill(); markScope(e.target); } }, "whole file"))) : null;
  function markScope(btn) { for (const b of btn.parentNode.children) b.classList.toggle("on", b === btn); }
  dlg.append(
    h("h2", {}, "Copy and paste JSON"),
    h("div", { class: "desc" }, "Copy the text below to export. To import, replace the text with JSON from elsewhere (a whole file, one layout, or just a split/pane tree) and choose what to do with it. Each import is one undo step."),
    scope, box, msg,
    h("div", { class: "actions" }, copyBtn, bReplaceLayout, bAdd, bReplaceFile, h("button", { onclick: () => dlg.close() }, "Close")));
  dlg.addEventListener("close", () => dlg.remove());
  document.body.append(dlg);
  fill();
  dlg.showModal();
}

// ---------------------------------------------------------------- inspector

function renderInspector() {
  const box = $("#inspector");
  box.replaceChildren();
  const sel = S.sel;
  const parts = sel.kind === "pane" ? paneInspector(sel.path)
    : sel.kind === "split" ? splitInspector(sel.path)
      : sel.kind === "defaults" ? defaultsInspector() : layoutInspector();
  box.append(...parts.filter(Boolean));
}

function paneInspector(path) {
  const node = nodeAt(path);
  const leafProps = propsOf("leaf");
  const id = idOf(path);
  const geo = S.geo.leaves.find((l) => l.id === id);
  const label = node.title || (node.run ? (Array.isArray(node.run) ? node.run[0] : node.run) : null);
  const empty = !wantsWindow(node);
  const parts = [
    h("h2", {}, label ? `Pane: ${label}` : empty ? "Empty pane" : "Pane: shell"),
    h("div", { class: "sub" }, `id ${node.id || id}`, geo ? ` · ${geo.rect.width}×${geo.rect.height} px at ${geo.rect.x - monitor().x},${geo.rect.y - monitor().y}` : ""),
    h("div", { class: "actions" },
      h("button", { onclick: () => halvePane(path, "h"), title: "Cut pane: cut this pane in half with a horizontal line, into a top and a bottom part" }, "✂ Cut pane ─"),
      h("button", { onclick: () => halvePane(path, "v"), title: "Cut pane: cut this pane in half with a vertical line, into a left and a right part" }, "✂ Cut pane │"),
      path.length ? h("button", { onclick: () => addBeside(path), title: "Add another pane next to this one in the same direction" }, "Add pane next to it") : null,
      !empty ? h("button", { onclick: () => clearPane(path), title: "Remove all settings: no window opens here" }, "Make empty") : null,
      path.length ? h("button", { onclick: () => removePane(path), title: "Remove this pane; its neighbour takes the space (Delete)" }, "Remove pane") : null),
    empty ? h("div", { class: "hint" }, "This pane is empty: no window opens here. Type a command (or any other setting) below to give it a terminal window.") : null,
    h("div", { class: "desc" }, "Drag this pane onto another one to swap their contents; the sizes stay."),
  ];
  const opts = {
    allowed: leafProps,
    target: () => nodeAt(path, true),
    inherit: (k) => inherited(k, path, "pane"),
    problemFor: (k) => problemFor(k, S.layoutIndex, id),
  };
  const neighbours = mergeNeighbours(path);
  if (neighbours.length) {
    parts.push(h("div", { class: "actions" }, ...neighbours.map((n) =>
      h("button", { onclick: () => mergePanes(path, n.leaf), title: `Make one pane of this and '${paneLabel(n.leaf.leaf)}'` }, `Merge with ${n.side}`))));
  }
  parts.push(...fieldList(node, PANE_MAIN, opts));
  const more = h("details", {}, h("summary", {}, "More settings"), ...fieldList(node, PANE_MORE, opts));
  if (PANE_MORE.some((k) => has(node, k))) more.open = true;
  parts.push(more, otherKeys(node, leafProps));
  return parts;
}

function splitInspector(path) {
  const node = nodeAt(path);
  const rec = splitRecord(path);
  const nway = has(node, "children");
  const n = nway ? (Array.isArray(node.children) ? node.children.length : 0) : 2;
  const id = idOf(path);
  const opts = {
    allowed: propsOf("split"),
    target: () => nodeAt(path, true),
    inherit: (k) => inherited(k, path.concat([0]), "pane"),
    problemFor: (k) => problemFor(k, S.layoutIndex, id),
  };
  const parts = [
    h("h2", {}, `Split: ${n} panes, ${["rows", "h", "horizontal"].includes(node.dir) ? "stacked" : "side by side"}`),
    h("div", { class: "sub" }, `id ${id}${rec ? ` · ${rec.rect.width}×${rec.rect.height} px` : ""}`),
    h("div", { class: "actions" },
      h("button", { onclick: () => flipSplit(path) }, "Flip direction"),
      h("button", { onclick: () => addPart(path) }, "Add a pane"),
      h("button", { onclick: () => { S.sel = { kind: "pane", path: path.concat([0]) }; render(); } }, "Select first pane")),
    field(node, "dir", { target: opts.target }),
  ];
  if (!nway) {
    parts.push(field(node, "at", opts.problemFor ? { target: opts.target, problem: opts.problemFor("at") } : { target: opts.target }));
    if (rec) {
      const style = atStyle(node.at);
      const aPx = rec.bounds[1] - rec.bounds[0];
      const set = (st) => change(() => { nodeAt(path, true).at = atValue(rec, aPx, st); });
      parts.push(h("div", { class: "unit-row" },
        h("button", { class: style === "%" ? "on" : "", onclick: () => set("%") }, "% from start"),
        h("button", { class: style === "-%" ? "on" : "", onclick: () => set("-%") }, "% from end"),
        h("button", { class: style === "px" || style === "num" ? "on" : "", onclick: () => set("px") }, "px from start"),
        h("button", { class: style === "-px" ? "on" : "", onclick: () => set("-px") }, "px from end")));
      parts.push(h("div", { class: "hint" }, "Drag the line between the panes to move the split point; it snaps to nearby lines (hold Alt to turn that off); hold Shift while dragging to leave the line where it is and make a new one. The value keeps its unit; the buttons switch it without moving the line. Delete removes the line and merges the two panes."));
    }
  } else {
    parts.push(field(node, "sizes", { target: opts.target, problem: opts.problemFor("sizes") }));
  }
  parts.push(field(node, "margin", { target: opts.target, inherited: inherited("margin", path, "pane"), problem: opts.problemFor("margin") }));
  const more = h("details", {}, h("summary", {}, "Settings for every pane below"), ...fieldList(node, SPLIT_MORE, opts));
  if (SPLIT_MORE.some((k) => has(node, k))) more.open = true;
  parts.push(more, otherKeys(node, propsOf("split")));
  return parts;
}

function layoutInspector() {
  const l = lay();
  const allowed = propsOf("layout");
  const opts = {
    allowed,
    target: () => lay(),
    inherit: (k) => inherited(k, [], "layout"),
    problemFor: (k) => S.problems.find((p) => p.li === S.layoutIndex && p.id === null && p.text.includes(k)),
  };
  const parts = [
    h("h2", {}, `Layout: ${layoutName(l, S.layoutIndex)}`),
    h("div", { class: "sub" }, `${monitor().name}${monitor().preset ? "" : ` · ${monitor().width}×${monitor().height}`}`),
    h("div", { class: "hint" }, "Click a pane to edit it or cut it in half (Cut pane). Drag the lines between panes to resize them (Shift-drag a line, or an edge of the monitor, makes a new empty pane), a pane onto another to swap them, and the monitor's edges to try another size. Ctrl+Z undoes any of them, also a size change; Ctrl+Y redoes."),
  ];
  // With nothing selected "Cut pane" works on the whole screen while it is one single pane (an empty editor):
  // that pane is the first rectangle and it is cut in half. With several panes one must be selected first.
  const single = !isSplit(rootNode());
  const noPane = "Select a pane first: there are several panes on the screen";
  parts.push(h("div", { class: "actions" },
    h("button", { id: "layout-cut-h", disabled: !single, onclick: () => halvePane([], "h"),
      title: single ? "Cut pane: cut the whole screen in half with a horizontal line, into a top and a bottom part" : noPane }, "✂ Cut pane ─"),
    h("button", { id: "layout-cut-v", disabled: !single, onclick: () => halvePane([], "v"),
      title: single ? "Cut pane: cut the whole screen in half with a vertical line, into a left and a right part" : noPane }, "✂ Cut pane │")));
  parts.push(h("details", { open: true, id: "command-lines" }, h("summary", {}, "Command line"), commandsBlock(() => renderInspector())));
  parts.push(...fieldList(l, LAYOUT_MAIN, opts));
  const more = h("details", {}, h("summary", {}, "Settings for every pane"), ...fieldList(l, LAYOUT_MORE, opts));
  if (LAYOUT_MORE.some((k) => has(l, k))) more.open = true;
  parts.push(more);
  parts.push(h("div", { class: "actions" }, h("button", { onclick: () => { S.sel = { kind: "defaults" }; render(); } }, "File defaults…")));
  parts.push(otherKeys(l, allowed.concat([...FILE_KEYS])));
  return parts;
}

function defaultsInspector() {
  const d = isObj(S.doc.defaults) ? S.doc.defaults : {};
  const allowed = propsOf("defaults");
  const opts = {
    allowed,
    target: () => { if (!isObj(S.doc.defaults)) S.doc.defaults = {}; return S.doc.defaults; },
    inherit: (k) => inherited(k, [], "defaults"),
    problemFor: (k) => S.problems.find((p) => p.text.startsWith(`defaults.${k}`)),
  };
  return [
    h("h2", {}, "File defaults"),
    h("div", { class: "sub" }, "Used by every layout in this file unless the layout, a split or a pane sets its own."),
    h("div", { class: "actions" }, h("button", { onclick: () => { S.sel = { kind: "layout" }; render(); } }, "Back to the layout")),
    ...fieldList(d, allowed, opts),
  ];
}

// ---------------------------------------------------------------- screen

function renderScreen() {
  const stage = $("#stage");
  const screen = $("#screen");
  const m = monitor();
  const pad = 28, bar = 44;
  const scale = S.fixedScale || Math.max(0.01, Math.min((stage.clientWidth - 2 * pad) / m.width, (stage.clientHeight - 2 * pad - bar) / m.height));
  S.view = { scale, m };
  screen.style.width = `${Math.round(m.width * scale)}px`;
  screen.style.height = `${Math.round(m.height * scale)}px`;
  screen.replaceChildren();
  const box = (r, cls) => h("div", { class: cls, style: {
    left: `${(r.x - m.x) * scale}px`, top: `${(r.y - m.y) * scale}px`, width: `${r.width * scale}px`, height: `${r.height * scale}px`,
  } });
  const area = areaFor(lay());
  if (area.width !== m.width || area.height !== m.height) {
    screen.append(box({ x: m.x, y: m.y, width: m.width, height: m.height }, "panel-shade"));
    const work = box(area, "outer");
    work.style.background = "var(--screen)";
    screen.append(work);
  }
  const bad = new Set(S.problems.filter((p) => p.level === "error" && p.li === S.layoutIndex && p.id).map((p) => p.id));
  for (const l of S.geo.leaves) {
    screen.append(box(l.outer, "outer"));
    const empty = !wantsWindow(l.leaf);
    const selected = S.sel.kind === "pane" && idOf(S.sel.path) === l.id;
    const label = l.leaf.title || (l.leaf.run ? (Array.isArray(l.leaf.run) ? l.leaf.run.join("; ") : l.leaf.run) : empty ? "(empty)" : "(shell)");
    const el = box(l.rect, `pane${empty ? " empty" : ""}${selected ? " selected" : ""}${bad.has(l.id) ? " bad" : ""}`);
    el.dataset.id = l.id;
    el.append(h("div", { class: "label" }, label), h("div", { class: "meta" }, `${l.rect.width}×${l.rect.height}`, l.leaf.id ? ` · ${l.leaf.id}` : ""));
    el.title = `${label}\n${l.rect.width}×${l.rect.height} px, pane ${l.leaf.id || l.id}`;
    el.addEventListener("pointerdown", (e) => startPaneDrag(e, l));
    screen.append(el);
  }
  for (const s of S.geo.splits) {
    for (let i = 1; i < s.bounds.length - 1; i++) {
      const b = s.bounds[i];
      const thick = 10;
      // The ends stop short of the split's edges, so where a nested split's line
      // meets this one the outer line stays grabbable; outer splits are on top.
      const inset = thick;
      const r = s.vertical
        ? { left: (b - m.x) * scale - thick / 2, top: (s.rect.y - m.y) * scale + inset, width: thick, height: Math.max(thick, s.rect.height * scale - 2 * inset) }
        : { left: (s.rect.x - m.x) * scale + inset, top: (b - m.y) * scale - thick / 2, width: Math.max(thick, s.rect.width * scale - 2 * inset), height: thick };
      const selected = S.sel.kind === "split" && idOf(S.sel.path) === s.id;
      const el = h("div", { class: `handle ${s.vertical ? "v" : "h"}${selected ? " selected" : ""}`, title: "Drag to resize; click to edit the split; hold Shift while dragging to leave this line and make a new one",
        style: { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, zIndex: String(100 - s.path.length) } });
      el.dataset.split = s.id;
      el.dataset.boundary = String(i);
      el.addEventListener("pointerdown", (e) => startDrag(e, s, i - 1));
      screen.append(el);
    }
  }
  if (S.geo.stale) screen.append(h("div", { class: "screen-note" }, "Showing the last layout that fit; see the problems below."));
  if (S.sel.kind === "pane" && !S.cut) {
    const me = S.geo.leaves.find((l) => l.id === idOf(S.sel.path));
    if (me) {
      for (const n of mergeNeighbours(S.sel.path)) {
        const r = me.rect, o = n.leaf.rect;
        const mid = (a, b) => (a + b) / 2;
        let cx, cy;
        if (n.side === "left" || n.side === "right") {
          cx = n.side === "left" ? mid(o.x + o.width, r.x) : mid(r.x + r.width, o.x);
          cy = r.y + r.height / 2;
        } else {
          cy = n.side === "above" ? mid(o.y + o.height, r.y) : mid(r.y + r.height, o.y);
          cx = r.x + r.width / 2;
        }
        const arrow = { left: "⇠", right: "⇢", above: "⇡", below: "⇣" }[n.side];
        const b = h("button", { class: "merge-btn", title: `Merge with the pane ${n.side === "above" || n.side === "below" ? n.side : `on the ${n.side}`} ('${paneLabel(n.leaf.leaf)}')`,
          style: { left: `${(cx - m.x) * scale - 11}px`, top: `${(cy - m.y) * scale - 11}px` } }, arrow);
        b.dataset.merge = n.side;
        b.addEventListener("pointerdown", (e) => e.stopPropagation());
        b.addEventListener("click", () => mergePanes(S.sel.path, n.leaf));
        screen.append(b);
      }
    }
  }
  if (S.cut) screen.append(cutOverlay());
  {
    // The places where a Shift-drag starts a new pane, shown while Shift is held.
    const { scale, m } = S.view;
    const ar = areaFor(lay());
    const z = EDGE_PX / scale;
    for (const [x, y, w, hh] of [[ar.x, ar.y, z, ar.height], [ar.x + ar.width - z, ar.y, z, ar.height],
      [ar.x, ar.y, ar.width, z], [ar.x, ar.y + ar.height - z, ar.width, z]]) {
      screen.append(h("div", { class: "edge-zone", style: { left: `${(x - m.x) * scale}px`, top: `${(y - m.y) * scale}px`,
        width: `${w * scale}px`, height: `${hh * scale}px` } }));
    }
  }
  for (const side of ["n", "s", "e", "w", "ne", "nw", "se", "sw"]) {
    const el = h("div", { class: `mon-handle ${side}`, title: "Drag to change the preview's monitor size (Shift keeps the shape, Alt gives exact pixels)" });
    el.addEventListener("pointerdown", (e) => startMonitorResize(e, side));
    screen.append(el);
  }
  renderScreenbar();
}

function setCutMode(dir) {
  S.cut = S.cut === dir ? null : dir;
  render();
}

// While cutting: a dashed line across the monitor follows the mouse, snaps to
// existing boundaries, shows its position and marks the panes it would cut.
function cutOverlay() {
  const { scale, m } = S.view;
  const dir = S.cut;
  const overlay = h("div", { class: "cut-overlay", id: "cut-overlay" });
  const line = h("div", { class: `cut-line ${dir}` });
  const tip = h("div", { class: "size-tip", style: { position: "absolute" } });
  overlay.append(line, tip);
  const edges = [...new Set(S.geo.leaves.flatMap((l) => (dir === "h" ? [l.outer.y, l.outer.y + l.outer.height] : [l.outer.x, l.outer.x + l.outer.width])))];
  let coord = null;
  const at = (ev) => {
    const r = overlay.getBoundingClientRect();
    let c = dir === "h" ? (ev.clientY - r.top) / scale + m.y : (ev.clientX - r.left) / scale + m.x;
    const near = edges.map((e) => [Math.abs(e - c) * scale, e]).sort((p, q) => p[0] - q[0])[0];
    if (near && near[0] < 8 && !ev.altKey) c = near[1];
    return Math.round(c);
  };
  const mark = () => {
    document.querySelectorAll(".pane.cut-target, .pane.cut-skip").forEach((p) => p.classList.remove("cut-target", "cut-skip"));
    if (coord === null) return;
    const { targets, skipped } = cutTargets(dir, coord);
    targets.forEach((l) => document.querySelector(`.pane[data-id="${l.id}"]`)?.classList.add("cut-target"));
    skipped.forEach((l) => document.querySelector(`.pane[data-id="${l.id}"]`)?.classList.add("cut-skip"));
  };
  overlay.addEventListener("pointermove", (ev) => {
    coord = at(ev);
    const pos = (coord - (dir === "h" ? m.y : m.x)) * scale;
    if (dir === "h") { line.style.top = `${pos - 1}px`; tip.style.top = `${pos + 6}px`; tip.style.left = "8px"; }
    else { line.style.left = `${pos - 1}px`; tip.style.left = `${pos + 6}px`; tip.style.top = "8px"; }
    tip.textContent = `${dir === "h" ? "y" : "x"} = ${coord - (dir === "h" ? m.y : m.x)} px · click to cut, Esc to stop`;
    mark();
  });
  overlay.addEventListener("pointerleave", () => { coord = null; mark(); });
  overlay.addEventListener("pointerdown", (ev) => {
    ev.stopPropagation();
    const c = at(ev);
    S.cut = ev.shiftKey ? S.cut : null;
    cutAt(dir, c);
    if (S.cut) render();
  });
  return overlay;
}

function renderScreenbar() {
  const m = monitor();
  const l = lay();
  const margin = pickLayoutKey(l, "margin", 8);
  const setMargin = (v) => {
    if (!Number.isFinite(v) || v < 0) return;
    change(() => setInherited(lay(), "margin", Math.round(v)));
  };
  const input = h("input", { type: "text", inputmode: "numeric", value: String(margin), id: "margin-input", title: "Gap between windows, in pixels (the layout's margin)" });
  input.addEventListener("change", () => setMargin(Number(input.value)));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
  const parts = [
    h("span", {}, "Monitor ", h("span", { class: "size", id: "monitor-size" }, `${m.width} × ${m.height} px`)),
  ];
  if (S.useCustom) parts.push(h("button", { onclick: () => previewChange(() => { S.useCustom = false; }), title: "Back to the monitor chosen in the list" }, "Reset size"));
  parts.push(h("span", {}, "Margin ",
    h("button", { onclick: () => setMargin(margin - 1), title: "Smaller gap" }, "−"), " ", input, " ",
    h("button", { onclick: () => setMargin(margin + 1), title: "Larger gap" }, "+"), " px"));
  parts.push(h("div", { id: "screen-tip" },
    S.sel.kind === "pane" || S.sel.kind === "split"
      ? "Tip: click outside the monitor to unselect and see the command lines."
      : "Tip: click a pane to edit it; drag a pane onto another to swap them."));
  $("#screenbar").replaceChildren(...parts);
}

// Drag a pane onto another to swap their contents; a short click selects it.
function startPaneDrag(e, leaf) {
  e.preventDefault();
  e.stopPropagation();
  const startX = e.clientX, startY = e.clientY;
  let dragging = false, target = null, ghost = null;
  const source = () => document.querySelector(`.pane[data-id="${leaf.id}"]`);
  const box = e.currentTarget.getBoundingClientRect();
  // While moving, the copy is at most 240x150 and held by its middle; over a
  // target it takes that pane's place, showing where the contents will land.
  const gw = Math.min(box.width, 240), gh = Math.min(box.height, 150);
  const onMove = (ev) => {
    if (!dragging && Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) < 6) return;
    if (!dragging) {
      // A copy of the pane follows the pointer, so the move is visible.
      const el = source();
      ghost = h("div", { class: `drag-ghost${el && el.classList.contains("empty") ? " empty" : ""}`, id: "drag-ghost" },
        h("div", { class: "label" }, el ? el.querySelector(".label").textContent : ""),
        h("div", { class: "ghost-hint" }, "drop on another pane to swap"));
      document.body.append(ghost);
    }
    dragging = true;
    source()?.classList.add("drag-source");
    document.body.style.cursor = "grabbing";
    const place = (x, y, w, hh) => Object.assign(ghost.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${hh}px` });
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const pane = under ? under.closest(".pane") : null;
    const id = pane && pane.dataset.id !== leaf.id ? pane.dataset.id : null;
    if (id !== target) {
      document.querySelectorAll(".pane.drop-target").forEach((p) => p.classList.remove("drop-target"));
      target = id;
      if (pane && id) pane.classList.add("drop-target");
    }
    ghost.querySelector(".ghost-hint").textContent = pane && id ? "release to swap here" : "drop on another pane to swap";
    if (pane && id) {
      const r = pane.getBoundingClientRect();
      place(r.left, r.top, r.width, r.height);
    } else {
      place(ev.clientX - gw / 2, ev.clientY - gh / 2, gw, gh);
    }
  };
  const onUp = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    document.body.style.cursor = "";
    if (ghost) ghost.remove();
    if (dragging && target) {
      swapPanes(leaf.path, pathOf(target));
      return;
    }
    S.sel = { kind: "pane", path: leaf.path };
    render();
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

// Drag an edge or corner of the preview to try the layout on another size.
function startMonitorResize(e, side) {
  e.preventDefault();
  e.stopPropagation();
  const m0 = monitor();
  const w0 = m0.width, h0 = m0.height;
  const before = snapshot();
  const startX = e.clientX, startY = e.clientY;
  S.fixedScale = S.view.scale;
  const tip = h("div", { class: "size-tip" });
  document.body.append(tip);
  const onMove = (ev) => {
    const dx = (ev.clientX - startX) / S.fixedScale, dy = (ev.clientY - startY) / S.fixedScale;
    let w = w0, hh = h0;
    if (side.includes("e")) w = w0 + dx;
    if (side.includes("w")) w = w0 - dx;
    if (side.includes("s")) hh = h0 + dy;
    if (side.includes("n")) hh = h0 - dy;
    if (ev.shiftKey) {
      const ratio = w0 / h0;
      if (side.length === 2) { if (Math.abs(w / w0) > Math.abs(hh / h0)) hh = w / ratio; else w = hh * ratio; }
      else if (side === "e" || side === "w") hh = w / ratio;
      else w = hh * ratio;
    }
    const step = ev.altKey ? 1 : 10;
    w = clamp(Math.round(w / step) * step, 320, 16384);
    hh = clamp(Math.round(hh / step) * step, 200, 16384);
    setCustomSize(w, hh);
    computeGeometry();
    renderScreen();
    tip.textContent = `${w} × ${hh} px`;
    tip.style.left = `${ev.clientX + 14}px`;
    tip.style.top = `${ev.clientY + 14}px`;
  };
  const onUp = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    tip.remove();
    S.fixedScale = null;
    S.lastGood = null;
    if (snapshot() !== before) recordHistory(before);
    render();
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

// Shift-drag of a line: the old line stays and a new, parallel one is made where the line is dropped; between
// them is a new empty pane. `p0` is where the old line is, `p1` where the new one goes (monitor px). The split
// becomes an N-way split if it was a two-part one. Returns the path of the new pane.
function insertLine(split, i, p0, p1) {
  let node = nodeAt(split.path, true);
  if (!has(node, "children")) { node = toNway(node); replaceAt(split.path, node); }
  const b = split.bounds;
  const total = b[i + 2] - b[i];
  const right = p1 > p0;
  const sI = (right ? p0 : p1) - b[i];
  const sN = Math.abs(p1 - p0);
  const sJ = b[i + 2] - (right ? p1 : p0);
  const sizes = sizesOf(node);
  const oldI = sizes[i], oldJ = sizes[i + 1];
  const si = looseSize(oldI), sj = looseSize(oldJ);
  let fresh;
  if (si.kind === "frac" && sj.kind === "frac") {
    const f = si.value + sj.value;
    sizes[i] = `${fmt((f * sI) / total, 4)}frac`;
    fresh = `${fmt((f * sN) / total, 4)}frac`;
    sizes[i + 1] = `${fmt((f * sJ) / total, 4)}frac`;
  } else {
    if (si.kind !== "frac") sizes[i] = sizeValue(split, i, sI, oldI, true);
    if (sj.kind !== "frac") sizes[i + 1] = sizeValue(split, i + 1, sJ, oldJ, true);
    // The new pane is sized like the pane that gave it room; a flexible one gives pixels.
    const ref = right ? sj : si;
    fresh = ref.kind === "frac" ? `${Math.round(sN)}px` : sizeValue(split, right ? i + 1 : i, sN, right ? oldJ : oldI, true);
  }
  node.children.splice(i + 1, 0, {});
  sizes.splice(i + 1, 0, fresh);
  setKey(node, "sizes", sizes);
  return split.path.concat([i + 1]);
}

// A new empty pane along the edge of the work area, in front of the one pane `leaf` that touches it: `edge`
// is "left", "right", "top" or "bottom", `w` the width of the new pane in monitor px.
function addEdgePane(leaf, edge, w) {
  const vertical = edge === "left" || edge === "right";
  const first = edge === "left" || edge === "top";
  const ext = vertical ? leaf.outer.width : leaf.outer.height;
  const node = nodeAt(leaf.path, true);
  const pct = fmt((w / ext) * 100, 3);
  const at = first ? `${pct}%` : `-${pct}%`;
  const dir = vertical ? "columns" : "rows";
  replaceAt(leaf.path, first ? { dir, at, a: {}, b: node } : { dir, at, a: node, b: {} });
  return leaf.path.concat([first ? 0 : 1]);
}

function removeCopyPreview() {
  document.querySelectorAll(".copy-strip, #copy-guide").forEach((x) => x.remove());
}

// The strip between the old line and the new one (or the edge and the new line), drawn on the monitor.
function drawStrip(vertical, a, b, cross0, cross1, ok) {
  const { scale, m } = S.view;
  const o = vertical ? m.x : m.y, oc = vertical ? m.y : m.x;
  const lo = Math.min(a, b), len = Math.abs(b - a);
  const box = vertical
    ? { left: `${(lo - o) * scale}px`, top: `${(cross0 - oc) * scale}px`, width: `${len * scale}px`, height: `${(cross1 - cross0) * scale}px` }
    : { top: `${(lo - o) * scale}px`, left: `${(cross0 - oc) * scale}px`, height: `${len * scale}px`, width: `${(cross1 - cross0) * scale}px` };
  $("#screen").append(h("div", { class: `copy-strip${ok ? "" : " bad"}`, style: box }));
}

function startDrag(e, split, i) {
  e.preventDefault();
  e.stopPropagation();
  const before = snapshot();
  let moved = false;       // the pointer has moved far enough to count as a drag
  let live = false;        // the document holds the line moved to the pointer
  let copy = null;         // while Shift is held: the new line that would be made { coord, ok }
  let last = null;         // the last pointer position
  const startX = e.clientX, startY = e.clientY;
  const screenRect = $("#screen").getBoundingClientRect();
  const { scale, m } = S.view;
  // The line snaps onto the nearest parallel line elsewhere on the monitor
  // (within SNAP_PX screen pixels), so the panes on both sides line up and can
  // then be merged. Holding Alt turns the snapping off.
  const own = split.bounds[i + 1];
  const lo = split.bounds[i], hi = split.bounds[i + 2];
  const min = split.margin + MIN_PANE;
  // The lines of other splits count even when one of them is exactly where this line starts (that is how
  // two lines that were lined up before are snapped together again after the line was moved away). Inside the
  // dragged split itself the line's own start position does not count: that is the line.
  const inside = (l) => l.path.length >= split.path.length && split.path.every((v, k) => l.path[k] === v);
  const edges = [...new Set(S.geo.leaves.flatMap((l) => (split.vertical
    ? [l.outer.x, l.outer.x + l.outer.width] : [l.outer.y, l.outer.y + l.outer.height])
    .filter((v) => v > lo && v < hi && !(inside(l) && v === own))))];
  const cursorTip = h("div", { class: "size-tip", style: { position: "fixed" } });
  const pristine = () => { S.doc = JSON.parse(before).doc; };
  const onMove = (ev) => {
    last = ev;
    if (!moved && Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) < 3) return;
    moved = true;
    let coord = split.vertical ? (ev.clientX - screenRect.left) / scale + m.x : (ev.clientY - screenRect.top) / scale + m.y;
    let snapped = null;
    if (!ev.altKey && edges.length) {
      const near = edges.map((v) => [Math.abs(v - coord), v]).sort((p, q) => p[0] - q[0])[0];
      if (near[0] * scale < SNAP_PX) { snapped = near[1]; coord = snapped; }
    }
    let tipText = null;
    removeCopyPreview();
    if (ev.shiftKey) {
      // The old line stays; the new one only exists as a preview until the mouse button goes up.
      if (live) { pristine(); live = false; }
      coord = Math.round(coord);
      const width = Math.abs(coord - own);
      const room = coord > own ? hi - coord : coord - lo;
      copy = { coord, ok: width >= min && room >= min };
      computeGeometry();
      renderScreen();
      const r = split.rect;
      drawStrip(split.vertical, own, coord, split.vertical ? r.y : r.x, split.vertical ? r.y + r.height : r.x + r.width, copy.ok);
      tipText = copy.ok ? `New empty pane ${width} px wide · release to make it, Esc cancels`
        : "Too close: nothing is made when you release";
    } else {
      copy = null;
      moveBoundary(split, i, coord, snapped !== null);
      live = true;
      computeGeometry();
      renderScreen();
      const el = document.querySelector(`[data-split="${split.id}"][data-boundary="${i + 1}"]`);
      if (el) el.classList.add("dragging");
      if (edges.length) {
        tipText = ev.altKey ? "Snapping is off"
          : snapped !== null ? "Lined up with another line · hold Alt to turn snapping off" : "Hold Alt to turn snapping off";
        tipText += " · hold Shift to leave this line and make a new one";
      }
    }
    if (tipText) {
      cursorTip.textContent = tipText;
      cursorTip.style.left = `${ev.clientX + 16}px`;
      cursorTip.style.top = `${ev.clientY + 16}px`;
      if (!cursorTip.isConnected) document.body.append(cursorTip);
    }
    if (snapped !== null) {
      const pos = (snapped - (split.vertical ? m.x : m.y)) * scale;
      const guide = h("div", { class: `cut-line ${split.vertical ? "v" : "h"}`, id: "snap-guide",
        style: split.vertical ? { left: `${pos - 1}px` } : { top: `${pos - 1}px` } });
      const tip = h("div", { class: "size-tip", style: { position: "absolute", ...(split.vertical ? { left: `${pos + 6}px`, top: "8px" } : { top: `${pos + 6}px`, left: "8px" }) } },
        `lined up at ${split.vertical ? "x" : "y"} = ${snapped - (split.vertical ? m.x : m.y)} px`);
      $("#screen").append(guide, tip);
    }
  };
  const stop = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("keydown", onKey);
    window.removeEventListener("keyup", onKey);
    cursorTip.remove();
    removeCopyPreview();
  };
  // Pressing or releasing Shift or Alt changes the drag at once, without moving the mouse.
  const onKey = (k) => {
    if (k.key === "Escape") {
      stop();
      pristine();
      S.sel = { kind: "split", path: split.path, boundary: i };
      S.status = "cancelled";
      render();
    } else if ((k.key === "Shift" || k.key === "Alt") && last) {
      onMove({ clientX: last.clientX, clientY: last.clientY, shiftKey: k.shiftKey, altKey: k.altKey });
    }
  };
  const onUp = (ev) => {
    stop();
    if (copy && !ev.shiftKey && !live) {
      // Shift was let go without moving the mouse: the line goes where the pointer is, as usual.
      moveBoundary(split, i, copy.coord, false);
      live = true;
    }
    if (copy && ev.shiftKey) {
      pristine();
      if (copy.ok) {
        const pane = insertLine(split, i, own, copy.coord);
        normalize(lay());
        recordHistory(before);
        S.dirty = true;
        S.sel = { kind: "pane", path: pane };
      } else {
        S.sel = { kind: "split", path: split.path, boundary: i };
        S.status = "no new line: the new pane would be too small";
      }
      render();
      return;
    }
    if (moved && snapshot() !== before) {
      recordHistory(before);
      S.dirty = true;
    }
    S.sel = { kind: "split", path: split.path, boundary: i };
    render();
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("keydown", onKey);
  window.addEventListener("keyup", onKey);
}

// Where the pointer is, in monitor px, and which pane edge it is at: within EDGE_PX screen px inside the edge of
// the work area (the margin and the first pixels of the pane there), on a pane that touches that edge.
function edgeHit(e) {
  if (!S.geo.leaves.length) return null;
  const { scale, m } = S.view;
  const r = $("#screen").getBoundingClientRect();
  const x = (e.clientX - r.left) / scale + m.x, y = (e.clientY - r.top) / scale + m.y;
  const a = areaFor(lay());
  const zone = EDGE_PX / scale;
  const dist = { left: x - a.x, right: a.x + a.width - x, top: y - a.y, bottom: a.y + a.height - y };
  const box = {
    left: Math.min(...S.geo.leaves.map((l) => l.outer.x)), top: Math.min(...S.geo.leaves.map((l) => l.outer.y)),
    right: Math.max(...S.geo.leaves.map((l) => l.outer.x + l.outer.width)),
    bottom: Math.max(...S.geo.leaves.map((l) => l.outer.y + l.outer.height)),
  };
  let best = null;
  for (const [edge, d] of Object.entries(dist)) if (d >= 0 && d <= zone && (!best || d < best.d)) best = { edge, d };
  if (!best) return null;
  const vertical = best.edge === "left" || best.edge === "right";
  const at = { left: (l) => l.outer.x, right: (l) => l.outer.x + l.outer.width, top: (l) => l.outer.y, bottom: (l) => l.outer.y + l.outer.height }[best.edge];
  const touching = S.geo.leaves.filter((l) => at(l) === box[best.edge]);
  const along = vertical ? y : x;
  const span = (l) => (vertical ? [l.outer.y, l.outer.y + l.outer.height] : [l.outer.x, l.outer.x + l.outer.width]);
  const leaf = touching.find((l) => along >= span(l)[0] && along < span(l)[1])
    || touching.slice().sort((p, q) => Math.abs((span(p)[0] + span(p)[1]) / 2 - along) - Math.abs((span(q)[0] + span(q)[1]) / 2 - along))[0];
  return leaf ? { edge: best.edge, leaf, edgeAt: box[best.edge] } : null;
}

// Shift-drag from the edge of the work area: a new empty pane between the edge and the line that is dropped,
// in front of the one pane that was grabbed; the other panes at that edge stay as they are.
function startEdgePane(e, hit) {
  e.preventDefault();
  e.stopPropagation();
  const { edge, leaf, edgeAt } = hit;
  const vertical = edge === "left" || edge === "right";
  const first = edge === "left" || edge === "top";
  const before = snapshot();
  const { scale, m } = S.view;
  const screenRect = $("#screen").getBoundingClientRect();
  const min = (pickLayoutKey(lay(), "margin", 8) || 0) + MIN_PANE;
  const ext = vertical ? leaf.outer.width : leaf.outer.height;
  const cross = vertical ? [leaf.outer.y, leaf.outer.y + leaf.outer.height] : [leaf.outer.x, leaf.outer.x + leaf.outer.width];
  const others = [...new Set(S.geo.leaves.flatMap((l) => (vertical ? [l.outer.x, l.outer.x + l.outer.width] : [l.outer.y, l.outer.y + l.outer.height])))]
    .filter((v) => (first ? v > edgeAt : v < edgeAt) && Math.abs(v - edgeAt) < ext);
  const cursorTip = h("div", { class: "size-tip", style: { position: "fixed" } });
  let state = null;
  const onMove = (ev) => {
    let c = vertical ? (ev.clientX - screenRect.left) / scale + m.x : (ev.clientY - screenRect.top) / scale + m.y;
    if (!ev.altKey && others.length) {
      const near = others.map((v) => [Math.abs(v - c), v]).sort((p, q) => p[0] - q[0])[0];
      if (near[0] * scale < SNAP_PX) c = near[1];
    }
    c = Math.round(c);
    const w = first ? c - edgeAt : edgeAt - c;
    state = { c, w, ok: w >= min && ext - w >= min };
    removeCopyPreview();
    drawStrip(vertical, edgeAt, c, cross[0], cross[1], state.ok);
    cursorTip.textContent = state.ok ? `New empty pane ${w} px wide at the ${edge} edge · release to make it, Esc cancels`
      : (w < min ? "Too narrow: nothing is made when you release" : "Too wide: nothing is made when you release");
    cursorTip.style.left = `${ev.clientX + 16}px`;
    cursorTip.style.top = `${ev.clientY + 16}px`;
    if (!cursorTip.isConnected) document.body.append(cursorTip);
  };
  const stop = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("keydown", onKey);
    cursorTip.remove();
    removeCopyPreview();
  };
  const onKey = (k) => { if (k.key === "Escape") { stop(); S.status = "cancelled"; render(); } };
  const onUp = () => {
    stop();
    if (state && state.ok) {
      const pane = addEdgePane(leaf, edge, state.w);
      normalize(lay());
      recordHistory(before);
      S.dirty = true;
      S.sel = { kind: "pane", path: pane };
    } else if (state) {
      S.status = "no new pane: it would be too small";
    }
    render();
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("keydown", onKey);
}

// ---------------------------------------------------------------- header and footer

function renderHeader() {
  $("#file").textContent = `${S.fileName}${S.dirty ? " •" : ""}`;
  $("#file").title = S.server ? BOOT.path || S.fileName : S.fileName;
  const sel = $("#layout");
  sel.replaceChildren(...layouts().map((l, i) => h("option", { value: String(i), selected: i === S.layoutIndex }, layoutName(l, i))));
  $("#delete-layout").disabled = layouts().length < 2;
  const ms = $("#monitor");
  ms.replaceChildren(...S.monitors.map((m, i) => h("option", { value: String(i), selected: !S.useCustom && i === S.monitorIndex },
    m.preset ? m.name : `${m.number}: ${m.name} ${m.width}×${m.height}`)),
  ...(S.custom ? [h("option", { value: "custom", selected: S.useCustom }, `Custom size: ${S.custom.width}×${S.custom.height}`)] : []));
  const ws = $("#workspace");
  const own = pickLayoutKey(lay(), "workspace", null);
  // Numbers as tilepane uses them: 0 bottom left, along the rows, rows upward.
  const count = Math.max(S.workspaces || 9, Number.isInteger(own) ? own + 1 : 0);
  ws.replaceChildren(h("option", { value: "", selected: !Number.isInteger(own) }, "not set (current)"),
    ...Array.from({ length: count }, (_, i) => h("option", { value: String(i), selected: own === i },
      `${i}${i === 0 ? " (bottom left)" : ""}${S.workspaces && i >= S.workspaces ? " (not on this machine)" : ""}`)));
  $("#undo").disabled = !S.undo.length;
  $("#redo").disabled = !S.redo.length;
  $("#cut-h").classList.toggle("on", S.cut === "h");
  $("#cut-v").classList.toggle("on", S.cut === "v");
  const errors = errorsCount();
  for (const id of ["#save", "#open-screen"]) {
    const b = $(id);
    if (!b) continue;
    b.disabled = errors > 0;
    b.title = errors ? `Fix the ${errors} problem(s) listed at the bottom first` : b.dataset.title || "";
  }
  if ($("#open-screen")) $("#open-screen").textContent = S.dirty ? "Save and open on screen" : "Open on screen";
  document.title = `${S.dirty ? "• " : ""}${S.fileName} – tilepane editor`;
}

function renderFooter() {
  const f = $("#footer");
  f.replaceChildren();
  const all = S.problems.concat(S.serverProblems.map((t) => ({ level: "error", text: t, li: null, id: null })));
  const errors = all.filter((p) => p.level === "error").length;
  const warnings = all.length - errors;
  f.append(h("div", { class: "status" },
    errors ? `${errors} problem(s) to fix before saving` : "No problems",
    warnings ? ` · ${warnings} warning(s)` : "",
    S.status ? ` · ${S.status}` : ""));
  for (const p of all) {
    f.append(h("div", {
      class: `problem ${p.level}`,
      onclick: () => {
        if (p.li !== null && p.li !== undefined) S.layoutIndex = p.li;
        if (p.id) {
          const path = pathOf(p.id);
          const isSplitNode = isSplit(nodeAt(path));
          S.sel = { kind: isSplitNode ? "split" : "pane", path };
        }
        render();
      },
    }, `${p.level === "error" ? "✖" : "⚠"} ${p.text}`));
  }
  if (S.log) f.append(h("pre", {}, S.log));
}

// Text typed into a field is committed when the field loses focus (its change event). Clicks on the panes, the
// monitor and the lines do preventDefault() on pointerdown, so the field never loses focus there and the typed
// text would be thrown away by the next render. flushFields() makes the field lose focus first, so the text is
// committed before whatever the click or the key does. The render that the commit asks for is held back (a new
// DOM under the pointer would swallow the click that is on its way) and done once the click is over.
function flushFields() {
  const a = document.activeElement;
  if (!a || !a.matches || !a.matches("input, textarea") || a.readOnly) return;
  S.holdRender = true;
  try { a.blur(); } finally { S.holdRender = false; }
}

function render() {
  if (S.holdRender) { S.renderPending = true; return; }
  S.renderPending = false;
  if (S.layoutIndex >= layouts().length) S.layoutIndex = 0;
  if ((S.sel.kind === "pane" || S.sel.kind === "split") && !pathValid(S.sel.path)) S.sel = { kind: "layout" };
  computeGeometry();
  S.problems = validate();
  renderHeader();
  renderScreen();
  renderInspector();
  renderFooter();
}

function pathValid(path) {
  let n = rootNode();
  for (const i of path) {
    if (!isSplit(n)) return false;
    if (has(n, "children") && (!Array.isArray(n.children) || i >= n.children.length)) return false;
    if (!has(n, "children") && i > 1) return false;
    n = childOf(n, i) || {};
  }
  return true;
}

// ---------------------------------------------------------------- layouts

function ensureMulti() {
  if (multi()) return;
  const top = {}, l = {};
  for (const [k, v] of Object.entries(S.doc)) (FILE_KEYS.has(k) ? top : l)[k] = v;
  const named = { name: has(l, "name") ? l.name : stem(S.fileName), ...l };
  top.layouts = [named];
  S.doc = top;
}

function uniqueName(base) {
  const names = new Set(layouts().map((l, i) => layoutName(l, i)));
  if (!names.has(base)) return base;
  for (let i = 2; ; i++) if (!names.has(`${base}-${i}`)) return `${base}-${i}`;
}

function newLayout() {
  change(() => {
    ensureMulti();
    S.doc.layouts.push({ name: uniqueName("layout"), split: {} });
    S.layoutIndex = S.doc.layouts.length - 1;
    S.sel = { kind: "layout" };
  });
}

function copyLayout() {
  change(() => {
    const name = layoutName(lay(), S.layoutIndex);
    ensureMulti();
    const copy = JSON.parse(JSON.stringify(S.doc.layouts[S.layoutIndex]));
    copy.name = uniqueName(`${name}-copy`);
    S.doc.layouts.splice(S.layoutIndex + 1, 0, copy);
    S.layoutIndex += 1;
    S.sel = { kind: "layout" };
  });
}

function deleteLayout() {
  if (layouts().length < 2) return;
  if (!confirm(`Delete layout '${layoutName(lay(), S.layoutIndex)}'?`)) return;
  change(() => {
    S.doc.layouts.splice(S.layoutIndex, 1);
    S.layoutIndex = Math.max(0, S.layoutIndex - 1);
    S.sel = { kind: "layout" };
  });
}

// ---------------------------------------------------------------- files

function docText() { return JSON.stringify(S.doc, null, 2) + "\n"; }

function load(text, name) {
  let doc;
  try {
    doc = JSON.parse(text);
  } catch (e) {
    alert(`${name} is not valid JSON: ${e.message}`);
    return false;
  }
  if (!isObj(doc)) { alert(`${name} does not contain a JSON object`); return false; }
  S.doc = doc;
  S.fileName = name;
  S.layoutIndex = 0;
  S.sel = { kind: "layout" };
  S.undo = []; S.redo = []; S.dirty = false; S.serverProblems = []; S.lastGood = null;
  render();
  return true;
}

async function api(path, body) {
  const init = { method: body === undefined ? "GET" : "POST", headers: { "X-Tilepane-Token": S.token } };
  if (body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
  const r = await fetch(path, init);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.error || `${r.status} ${r.statusText}`);
    err.data = data;
    throw err;
  }
  return data;
}

async function save() {
  flushFields();
  render();
  if (errorsCount()) { S.status = "not saved: fix the problems first"; render(); return false; }
  const text = docText();
  if (S.server) {
    if (S.badDisk && !confirm("The file on disk is not valid JSON. Replace it with this layout?")) return false;
    try {
      const res = await api("/api/save", { text });
      S.serverProblems = [];
      S.badDisk = false;
      S.dirty = false;
      S.status = `saved ${new Date().toLocaleTimeString()}` + (res.warnings && res.warnings.length ? ` (${res.warnings.length} warning(s))` : "");
      render();
      return true;
    } catch (e) {
      S.serverProblems = (e.data && e.data.errors) || [e.message];
      S.status = "not saved";
      render();
      return false;
    }
  }
  try {
    if (S.fileHandle) {
      const w = await S.fileHandle.createWritable();
      await w.write(text);
      await w.close();
    } else if (window.showSaveFilePicker) {
      S.fileHandle = await window.showSaveFilePicker({ suggestedName: S.fileName, types: [{ description: "tilepane layout", accept: { "application/json": [".json"] } }] });
      S.fileName = S.fileHandle.name;
      const w = await S.fileHandle.createWritable();
      await w.write(text);
      await w.close();
    } else {
      const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: S.fileName });
      document.body.append(a);
      a.click();
      a.remove();
    }
  } catch (e) {
    if (e.name === "AbortError") return false;
    S.status = `not saved: ${e.message}`;
    render();
    return false;
  }
  S.dirty = false;
  S.status = `saved ${new Date().toLocaleTimeString()}`;
  render();
  return true;
}

async function openFile() {
  if (S.dirty && !confirm("Discard the unsaved changes?")) return;
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({ types: [{ description: "tilepane layout", accept: { "application/json": [".json"] } }] });
      const file = await handle.getFile();
      if (load(await file.text(), file.name)) S.fileHandle = handle;
    } catch (e) { if (e.name !== "AbortError") alert(e.message); }
    return;
  }
  const input = h("input", { type: "file", accept: ".json,application/json" });
  input.addEventListener("change", async () => {
    const file = input.files[0];
    if (file && load(await file.text(), file.name)) S.fileHandle = null;
  });
  input.click();
}

function newFile() {
  if (S.dirty && !confirm("Discard the unsaved changes?")) return;
  S.fileHandle = null;
  load(JSON.stringify(newDoc()), "my-layout.json");
}

async function onScreen(action) {
  flushFields();
  if (action === "open" && S.dirty && !(await save())) return;
  const m = monitor();
  S.status = action === "open" ? "opening windows…" : "closing windows…";
  renderFooter();
  try {
    const res = await api(`/api/${action}`, { layout: layoutName(lay(), S.layoutIndex), monitor: m.number });
    S.log = (res.output || "").trim();
    S.status = res.code === 0 ? (action === "open" ? "opened on screen" : "closed") : `tilepane exited with status ${res.code}`;
  } catch (e) {
    S.log = "";
    S.status = e.message;
  }
  renderFooter();
}

// ---------------------------------------------------------------- start

function wire() {
  document.addEventListener("pointerdown", flushFields, true);
  // Shift shows where a drag from the edge starts a new pane, and starts it.
  const shiftClass = (k) => document.body.classList.toggle("shift", !!k.shiftKey);
  window.addEventListener("keydown", shiftClass);
  window.addEventListener("keyup", shiftClass);
  window.addEventListener("blur", () => document.body.classList.remove("shift"));
  $("#screen").addEventListener("pointerdown", (e) => {
    if (!e.shiftKey || e.button !== 0 || S.cut || e.target.closest(".mon-handle, .handle, .merge-btn")) return;
    const hit = edgeHit(e);
    if (hit) startEdgePane(e, hit);
  }, true);
  document.addEventListener("pointerup", () => {
    if (S.renderPending) setTimeout(() => { if (S.renderPending) render(); }, 0);
  });
  $("#layout").addEventListener("change", (e) => { S.layoutIndex = Number(e.target.value); S.sel = { kind: "layout" }; S.lastGood = null; render(); });
  $("#monitor").addEventListener("change", (e) => previewChange(() => {
    if (e.target.value === "custom") S.useCustom = true;
    else { S.monitorIndex = Number(e.target.value); S.useCustom = false; }
  }));
  $("#commands").addEventListener("click", openCommands);
  $("#json").addEventListener("click", openJson);
  $("#cut-h").addEventListener("click", () => setCutMode("h"));
  $("#cut-v").addEventListener("click", () => setCutMode("v"));
  $("#workspace").addEventListener("change", (e) => change(() => {
    const l = lay();
    if (e.target.value === "") delete l.workspace;
    else setInherited(l, "workspace", Number(e.target.value));
  }));
  $("#new-layout").addEventListener("click", newLayout);
  $("#copy-layout").addEventListener("click", copyLayout);
  $("#delete-layout").addEventListener("click", deleteLayout);
  $("#undo").addEventListener("click", undo);
  $("#redo").addEventListener("click", redo);
  $("#save").addEventListener("click", save);
  // A click on the monitor between panes, or anywhere outside it, clears the selection.
  $("#screen").addEventListener("pointerdown", () => { S.sel = { kind: "layout" }; render(); });
  $("#stage").addEventListener("pointerdown", (e) => {
    if (e.target.closest("#screen") || e.target.closest("#screenbar")) return;
    S.sel = { kind: "layout" };
    render();
  });
  if (S.server) {
    $("#new-file").remove();
    $("#open-file").remove();
    $("#open-screen").addEventListener("click", () => onScreen("open"));
    $("#close-screen").addEventListener("click", () => onScreen("close"));
  } else {
    $("#open-screen").remove();
    $("#close-screen").remove();
    $("#new-file").addEventListener("click", newFile);
    $("#open-file").addEventListener("click", openFile);
  }
  window.addEventListener("resize", () => renderScreen());
  window.addEventListener("keydown", (e) => {
    const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); save(); return; }
    if (typing) return;
    if (mod && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) { e.preventDefault(); redo(); }
    else if ((e.key === "Delete" || e.key === "Backspace") && S.sel.kind === "pane") { e.preventDefault(); removePane(S.sel.path); }
    else if ((e.key === "Delete" || e.key === "Backspace") && S.sel.kind === "split") { e.preventDefault(); deleteLine(S.sel.path, S.sel.boundary); }
    else if (e.key === "Escape") { S.cut = null; S.sel = { kind: "layout" }; render(); }
    else if (!mod && (e.key === "h" || e.key === "H")) setCutMode("h");
    else if (!mod && (e.key === "v" || e.key === "V")) setCutMode("v");
  });
  window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
}

function restoreCustomSize() {
  const c = recall("custom");
  if (c && Number.isInteger(c.width) && Number.isInteger(c.height) && c.width >= 320 && c.height >= 200) {
    setCustomSize(c.width, c.height);
    S.useCustom = false;
  }
}

async function start() {
  const style = recall("monitorStyle");
  if (style === "name" || style === "number") S.monitorStyle = style;
  wire();
  if (!S.server) {
    restoreCustomSize();
    load(JSON.stringify(newDoc()), "my-layout.json");
    return;
  }
  try {
    const st = await api("/api/state");
    S.monitors = st.monitors.length ? st.monitors : PRESETS;
    restoreCustomSize();
    S.fileName = st.name;
    BOOT.path = st.path;
    BOOT.home = st.home;
    S.workspaces = Number.isInteger(st.workspaces) ? st.workspaces : null;
    let doc = null;
    if (st.text !== null) {
      try { doc = JSON.parse(st.text); } catch (e) {
        S.badDisk = true;
        document.body.prepend(h("div", { class: "banner" }, `${st.name} is not valid JSON (${e.message}). Saving will replace it.`));
      }
    }
    S.doc = isObj(doc) ? doc : newDoc();
    S.dirty = st.text === null;
    if (st.text === null) S.status = "new file: it is written when you save";
    render();
  } catch (e) {
    document.body.prepend(h("div", { class: "banner" }, `Cannot reach tilepane: ${e.message}`));
    load(JSON.stringify(newDoc()), "my-layout.json");
  }
  setInterval(() => api("/api/ping", {}).catch(() => {}), 10000);
  window.addEventListener("pagehide", () => navigator.sendBeacon(`/api/bye?t=${encodeURIComponent(S.token)}`, ""));
}

start();
</script>
</body>
</html>
